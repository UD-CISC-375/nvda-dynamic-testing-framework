name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out framework repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install framework dependencies
        run: npm ci

      - name: Check out Team Y site
        uses: actions/checkout@v4
        with:
          repository: mlorang/nvda-dynamic-testing-webpage
          path: nvda-dynamic-testing-webpage

      - name: Install and build Team Y site
        working-directory: nvda-dynamic-testing-webpage
        run: |
          npm ci
          CI=false npm run build
          mkdir -p ../site-root
          rm -rf ../site-root/nvda-dynamic-testing-webpage
          cp -R build ../site-root/nvda-dynamic-testing-webpage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run type-check

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:4173/nvda-dynamic-testing-webpage/
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
