name: CI
run-name: "Test site: ${{ github.event_name == 'pull_request' && 'build and live' || github.event_name == 'workflow_dispatch' && inputs.site_branch || 'live' }}" # Generated by GPT-6 Sol

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      site_branch:
        description: Team Y site branch to build and test
        required: true
        default: main
        type: string

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["build", "live"]' || github.event_name == 'workflow_dispatch' && '["build"]' || '["live"]') }}

    steps:
      - name: Check out framework repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install framework dependencies
        run: npm ci

      - name: Check out Team Y site
        if: matrix.target == 'build'
        uses: actions/checkout@v4
        with:
          repository: UD-CISC-375/nvda-dynamic-testing-webpage
          ref: ${{ inputs.site_branch || 'main' }} # Generated by GPT-6 Sol
          path: nvda-dynamic-testing-webpage

      - name: Install and build Team Y site
        if: matrix.target == 'build'
        working-directory: nvda-dynamic-testing-webpage
        run: |
          npm ci
          CI=false npm run build
          mkdir -p ../site-root
          cp -R build ../site-root/nvda-dynamic-testing-webpage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run type-check

      - name: Run Playwright tests against site build
        if: matrix.target == 'build' # Generated by GPT-6 Sol
        env:
          BASE_URL: http://127.0.0.1:4173/nvda-dynamic-testing-webpage/
          LOCAL_BUILD: "1"
        run: npm test

      - name: Run Playwright tests against live site
        if: matrix.target == 'live'
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.target }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
