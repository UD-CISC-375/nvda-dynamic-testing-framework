name: CI
run-name: "Test site: ${{ github.event_name == 'schedule' && 'live' || github.event_name == 'workflow_dispatch' && inputs.site_branch || 'main' }}" # Generated by GPT-6 Sol

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      site_branch:
        description: Team Y site branch to build and test
        required: true
        default: main
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out framework repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install framework dependencies
        run: npm ci

      - name: Check out Team Y site
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4
        with:
          repository: mlorang/nvda-dynamic-testing-webpage
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.site_branch || 'main' }} # Generated by GPT-6 Sol
          path: nvda-dynamic-testing-webpage

      - name: Install and build Team Y site
        if: github.event_name != 'schedule'
        working-directory: nvda-dynamic-testing-webpage
        run: |
          npm ci
          CI=false npm run build
          mkdir -p ../site-root
          cp -R build ../site-root/nvda-dynamic-testing-webpage

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run type-check

      - name: Run Playwright tests against site build
        if: github.event_name != 'schedule' # Generated by GPT-6 Sol
        env:
          BASE_URL: http://127.0.0.1:4173/nvda-dynamic-testing-webpage/
          LOCAL_BUILD: "1"
        run: npm test

      - name: Run Playwright tests against live site
        if: github.event_name == 'schedule'
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30
