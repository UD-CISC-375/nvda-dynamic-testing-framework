<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Run accessibility tests</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    button { font-size: 1.25rem; padding: 0.75rem 1.5rem; }
    section { margin-top: 1.5rem; }
    /* No bullets: each tree line already starts with "- ". */
    ul { background: #f4f4f4; padding: 0.75rem 1rem; list-style: none; font-family: monospace; font-size: 1.1rem; }
    pre { background: #f4f4f4; padding: 0.75rem 1rem; font-size: 1.1rem; }
    .passed { color: #1a7f37; }
    .failed { color: #b00020; }   /* same red as signup-fixed.html */
  </style>
</head>
<body>
  <main>
    <!-- data-suite is sent to the server as /run?suite=..., see SUITES in server.mjs. -->
    <button type="button" data-suite="watch-dom">Run watch-dom tests</button>
    <button type="button" data-suite="aria-tree">Run accessibility-tree tests</button>
    <p id="status" role="status"></p>
    <div id="results"></div>
  </main>
  <script>
    const buttons = document.querySelectorAll("button[data-suite]");
    const status = document.getElementById("status");
    const results = document.getElementById("results");

    // Build an <h3> plus a <ul> of tree lines (or "(none)").
    function lineList(heading, lines) {
      const h = document.createElement("h3");
      h.textContent = heading;
      const ul = document.createElement("ul");
      for (const line of lines.length ? lines : ["(none)"]) {
        const li = document.createElement("li");
        li.textContent = line;
        ul.append(li);
      }
      return [h, ul];
    }

    // Turn the watcher's changes (see DomChange in watch-dom.ts) into
    // { added, removed } lines like the aria-tree diff, listing only nodes that
    // were inserted into or taken out of the page. Attribute changes (e.g.
    // aria-expanded, hidden) and text edits are left out on purpose: the
    // accessible menu only changes attributes, so it shows nothing here, while
    // the aria-tree diff shows the menu appearing.
    function domDiff(changes) {
      const added = [];
      const removed = [];
      for (const c of changes.filter((c) => c.type === "childList")) {
        // Changes inside a live region are the ones a screen reader announces.
        const live = c.inLiveRegion ? " (live region)" : "";
        for (const node of c.added) added.push(`- ${node} (in ${c.target})${live}`);
        for (const node of c.removed) removed.push(`- ${node} (in ${c.target})${live}`);
      }
      return { added, removed };
    }

    // Both buttons run the same way; only the suite they ask for differs.
    const setDisabled = (disabled) => buttons.forEach((b) => (b.disabled = disabled));

    for (const button of buttons) button.addEventListener("click", async () => {
      const suite = button.dataset.suite;
      // The server runs one suite at a time, so block both buttons.
      setDisabled(true);
      results.textContent = "";
      // The server runs the "manual" project, so Playwright waits for a person to click.
      status.textContent = "Running tests… Click the menu button each time the test browser shows the menu page.";
      // Ask the local server (server.mjs) to run Playwright; it answers when done.
      const res = await fetch(`/run?suite=${suite}`, { method: "POST" });
      if (!res.ok) {
        // Error replies (already running, Playwright crashed) are plain text.
        status.textContent = await res.text();
        setDisabled(false);
        return;
      }
      // "menu page loads" (menu.spec.ts) only checks the starting state, so it isn't shown.
      const tests = (await res.json()).tests.filter((t) => t.title !== "menu page loads");
      const failed = tests.filter((t) => t.status !== "passed").length;
      status.textContent = failed ? `${failed} of ${tests.length} tests failed.` : `All ${tests.length} tests passed.`;

      for (const test of tests) {
        const section = document.createElement("section");
        const h2 = document.createElement("h2");
        const passed = test.status === "passed";
        h2.textContent = `${passed ? "✓" : "✗"} ${test.title}`;
        h2.className = passed ? "passed" : "failed";
        section.append(h2);
        if (test.error) {
          const p = document.createElement("p");
          p.className = "failed";
          p.textContent = test.error;
          section.append(p);
        }
        // The aria-tree tests come with added/removed; the watch-dom ones are built
        // from changes, and only list elements, so their headings say so.
        if (suite === "watch-dom") {
          const { added, removed } = domDiff(test.changes);
          section.append(...lineList("Elements added", added), ...lineList("Elements removed", removed));
          // Then what the test printed, as in the terminal, minus the manual
          // mode's ">>> Click the menu button <<<" prompt.
          const output = test.output
            .split("\n")
            .filter((line) => !line.startsWith(">>>"))
            .join("\n")
            .trim();
          if (output) {
            const h = document.createElement("h3");
            h.textContent = "Test output";
            const pre = document.createElement("pre");
            pre.textContent = output;
            section.append(h, pre);
          }
        } else {
          section.append(...lineList("Added", test.added), ...lineList("Removed", test.removed));
        }
        results.append(section);
      }
      setDisabled(false);
    });
  </script>
</body>
</html>
